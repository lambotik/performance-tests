global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'docker-stats-exporter'
    static_configs:
      - targets: ['docker-stats-exporter:9273']

  - job_name: 'python-docker-stats'
    static_configs:
        # host.docker.internal — это адрес вашего Mac изнутри Docker
        - targets: [ 'host.docker.internal:9126' ]
